<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mughal Foods</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col">

    <!-- Navbar -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-orange-500">MUGHAL FOODS</h1>
            <div class="flex gap-3">
                <button onclick="alert('Cart Clicked Successfully!')" class="bg-orange-600 px-4 py-2 rounded-xl font-bold text-sm">
                    <i class="fa-solid fa-cart-shopping"></i> Cart
                </button>
                <button onclick="alert('Admin Panel Clicked Successfully!')" class="bg-slate-800 px-4 py-2 rounded-xl font-bold text-sm">
                    <i class="fa-solid fa-user-shield"></i> Admin
                </button>
            </div>
        </div>
    </header>

    <!-- Content -->
    <main class="max-w-6xl mx-auto p-4 space-y-6 flex-grow">
        <div class="bg-gradient-to-r from-orange-600 to-amber-600 p-8 rounded-2xl text-center space-y-3">
            <h2 class="text-3xl font-ext0rabold">Welcome to Mughal Foods</h2>
            <p class="text-orange-100">Fast, Fresh & Delicious Fast Food</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3">
                <h3 class="font-bold text-lg">Zinger Burger</h3>
                <p class="text-slate-400 text-sm">Crispy fried chicken with spicy mayo.</p>
                <div class="flex justify-between items-center">
                    <span class="text-orange-500 font-bold">PKR 380</span>
                    <button onclick="alert('Zinger Burger Added to Cart!')" class="bg-orange-600 px-3 py-1.5 rounded-lg text-xs font-bold">Add to Cart</button>
                </div>
            </div>

            <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3">
                <h3 class="font-bold text-lg">Crispy Fish</h3>
                <p class="text-slate-400 text-sm">Fresh Lahori style spicy fried fish.</p>
                <div class="flex justify-between items-center">
                    <span class="text-orange-500 font-bold">PKR 1200</span>
                    <button onclick="alert('Fish Added to Cart!')" class="bg-orange-600 px-3 py-1.5 rounded-lg text-xs font-bold">Add to Cart</button>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
