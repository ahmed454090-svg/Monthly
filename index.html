<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Invoice Generator</title>
    <!-- Tailwind CSS for Quick Modern UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: white; padding: 0; }
            .print-area { shadow: none; border: none; width: 100%; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- LEFT PANEL: INPUT FORM (Hidden during print) -->
        <div class="lg:col-span-5 bg-white p-6 rounded-xl shadow-md space-y-4 no-print border border-slate-200">
            <h2 class="text-xl font-bold text-slate-900 border-b pb-2">Invoice Details</h2>
            
            <div class="space-y-3">
                <div>
                    <label class="text-xs font-semibold text-slate-600 uppercase">Your Company / Name</label>
                    <input type="text" id="sellerName" value="My Studio" class="w-full p-2 border rounded-md text-sm mt-1 focus:ring-2 focus:ring-blue-500 outline-none" oninput="updateInvoice()">
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-600 uppercase">Client Name</label>
                    <input type="text" id="clientName" value="John Doe" class="w-full p-2 border rounded-md text-sm mt-1 focus:ring-2 focus:ring-blue-500 outline-none" oninput="updateInvoice()">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs font-semibold text-slate-600 uppercase">Invoice #</label>
                        <input type="text" id="invoiceNum" value="INV-1001" class="w-full p-2 border rounded-md text-sm mt-1 focus:ring-2 focus:ring-blue-500 outline-none" oninput="updateInvoice()">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-slate-600 uppercase">Tax %</label>
                        <input type="number" id="taxRate" value="10" class="w-full p-2 border rounded-md text-sm mt-1 focus:ring-2 focus:ring-blue-500 outline-none" oninput="updateInvoice()">
                    </div>
                </div>
            </div>

            <h3 class="font-bold text-slate-800 pt-2 border-b">Items</h3>
            <div id="itemsContainer" class="space-y-2">
                <!-- Item Rows will be dynamically added here -->
            </div>

            <button onclick="addItemRow()" class="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-md text-sm transition">+ Add Item</button>

            <div class="pt-4 border-t">
                <button onclick="window.print()" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-md shadow transition flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                    Download PDF / Print
                </button>
            </div>
        </div>

        <!-- RIGHT PANEL: LIVE INVOICE PREVIEW -->
        <div class="lg:col-span-7">
            <div class="print-area bg-white p-8 rounded-xl shadow-md border border-slate-200 min-h-[550px] flex flex-col justify-between">
                <div>
                    <!-- Header -->
                    <div class="flex justify-between items-start border-b pb-6">
                        <div>
                            <h1 class="text-3xl font-black text-blue-600 tracking-tight">INVOICE</h1>
                            <p class="text-slate-500 text-sm mt-1" id="outSeller">My Studio</p>
                        </div>
                        <div class="text-right">
                            <p class="font-bold text-slate-700" id="outInvoiceNum">INV-1001</p>
                            <p class="text-xs text-slate-400 mt-1">Date: <span id="outDate"></span></p>
                        </div>
                    </div>

                    <!-- Client Info -->
                    <div class="my-6">
                        <p class="text-xs text-slate-400 uppercase font-semibold">Billed To:</p>
                        <p class="text-lg font-bold text-slate-800" id="outClient">John Doe</p>
                    </div>

                    <!-- Items Table -->
                    <table class="w-full text-left my-6">
                        <thead>
                            <tr class="border-b text-xs text-slate-400 uppercase">
                                <th class="py-2">Description</th>
                                <th class="py-2 text-center">Qty</th>
                                <th class="py-2 text-right">Price</th>
                                <th class="py-2 text-right">Total</th>
                            </tr>
                        </thead>
                        <tbody id="outTableBody" class="divide-y text-sm">
                            <!-- Live Rows -->
                        </tbody>
                    </table>
                </div>

                <!-- Totals -->
                <div class="border-t pt-4">
                    <div class="w-1/2 ml-auto space-y-2 text-sm">
                        <div class="flex justify-between text-slate-500">
                            <span>Subtotal:</span>
                            <span id="outSubtotal">$0.00</span>
                        </div>
                        <div class="flex justify-between text-slate-500">
                            <span>Tax:</span>
                            <span id="outTax">$0.00</span>
                        </div>
                        <div class="flex justify-between text-base font-bold text-slate-900 border-t pt-2">
                            <span>Total Due:</span>
                            <span id="outTotal" class="text-blue-600">$0.00</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        let items = [
            { desc: "Web Development", qty: 1, price: 150 },
            { desc: "Domain & Hosting", qty: 1, price: 25 }
        ];

        // Set Current Date
        document.getElementById('outDate').innerText = new Date().toLocaleDateString();

        function renderItemInputs() {
            const container = document.getElementById('itemsContainer');
            container.innerHTML = '';
            items.forEach((item, index) => {
                container.innerHTML += `
                    <div class="flex gap-2 items-center">
                        <input type="text" value="${item.desc}" oninput="updateItem(${index}, 'desc', this.value)" placeholder="Item desc" class="flex-1 p-2 border rounded-md text-sm outline-none">
                        <input type="number" value="${item.qty}" oninput="updateItem(${index}, 'qty', this.value)" placeholder="Qty" class="w-16 p-2 border rounded-md text-sm outline-none text-center">
                        <input type="number" value="${item.price}" oninput="updateItem(${index}, 'price', this.value)" placeholder="Price" class="w-20 p-2 border rounded-md text-sm outline-none text-right">
                        <button onclick="removeItem(${index})" class="text-red-500 hover:text-red-700 font-bold px-1">✕</button>
                    </div>
                `;
            });
            updateInvoice();
        }

        function addItemRow() {
            items.push({ desc: "New Service", qty: 1, price: 0 });
            renderItemInputs();
        }

        function removeItem(index) {
            items.splice(index, 1);
            renderItemInputs();
        }

        function updateItem(index, key, value) {
            items[index][key] = key === 'desc' ? value : parseFloat(value) || 0;
            updateInvoice();
        }

        function updateInvoice() {
            // Update Text Details
            document.getElementById('outSeller').innerText = document.getElementById('sellerName').value || 'Company Name';
            document.getElementById('outClient').innerText = document.getElementById('clientName').value || 'Client Name';
            document.getElementById('outInvoiceNum').innerText = document.getElementById('invoiceNum').value || 'INV-000';

            // Calculate Totals
            let subtotal = 0;
            const tbody = document.getElementById('outTableBody');
            tbody.innerHTML = '';

            items.forEach(item => {
                const itemTotal = item.qty * item.price;
                subtotal += itemTotal;
                tbody.innerHTML += `
                    <tr>
                        <td class="py-3 font-medium text-slate-700">${item.desc}</td>
                        <td class="py-3 text-center text-slate-500">${item.qty}</td>
                        <td class="py-3 text-right text-slate-500">$${item.price.toFixed(2)}</td>
                        <td class="py-3 text-right font-semibold text-slate-700">$${itemTotal.toFixed(2)}</td>
                    </tr>
                `;
            });

            const taxRate = parseFloat(document.getElementById('taxRate').value) || 0;
            const taxAmount = (subtotal * taxRate) / 100;
            const grandTotal = subtotal + taxAmount;

            document.getElementById('outSubtotal').innerText = '$' + subtotal.toFixed(2);
            document.getElementById('outTax').innerText = '$' + taxAmount.toFixed(2);
            document.getElementById('outTotal').innerText = '$' + grandTotal.toFixed(2);
        }

        // Initialize
        renderItemInputs();
    </script>
</body>
</html>
